<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dareloom - Shortener</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔗 Dareloom Shortener</h1>
      <p>Generate verification link — visitors complete 3-step verification to reach the target.</p>
    </div>

    <div style="display:flex;gap:10px;align-items:center">
      <input id="longUrl" type="url" placeholder="https://example.com/your-file.zip" style="flex:1;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);background:#07101a;color:#e6f2ff"/>
      <button id="gen" class="btn">Generate</button>
    </div>

    <div id="out" style="display:none;margin-top:12px;">
      <div style="color:#9ab;font-size:13px">Share this verification link:</div>
      <input id="short" readonly style="width:100%;margin-top:8px;padding:10px;border-radius:8px;background:#08121a;border:1px solid rgba(0,255,136,0.03);color:#00ffb3"/>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button id="copy" class="btn ghost">Copy</button>
        <button id="open" class="btn ghost">Open (test)</button>
      </div>
    </div>
  </div>

<script>
(function(){
  const gen = document.getElementById('gen');
  const long = document.getElementById('longUrl');
  const out = document.getElementById('out');
  const short = document.getElementById('short');
  const copy = document.getElementById('copy');
  const openBtn = document.getElementById('open');

  gen.addEventListener('click', ()=> {
    let v = long.value.trim();
    if(!v) return alert('Enter a URL');
    if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try { new URL(v); } catch(e){ return alert('Invalid URL'); }
    const encoded = encodeURIComponent(v);
    const base = window.location.origin + window.location.pathname.replace(/[^/]*$/,'');
    const verifyUrl = `${base}verify.html?target=${encoded}`;
    short.value = verifyUrl;
    out.style.display = 'block';
  });

  copy.addEventListener('click', ()=> {
    if(!short.value) return;
    navigator.clipboard.writeText(short.value).then(()=> {
      copy.textContent = 'Copied!';
      setTimeout(()=>copy.textContent = 'Copy',1400);
    }).catch(()=> {
      short.select();
      document.execCommand('copy');
    });
  });

  openBtn.addEventListener('click', ()=> {
    if(!short.value) return alert('Generate first');
    window.open(short.value,'_blank');
  });
})();
</script>
</body>
</html>
