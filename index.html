<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dareloom Link Shortener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🔗 Dareloom Shortener</h1>
    <input type="text" id="longUrlInput" placeholder="Enter your URL..." />
    <button id="shortenBtn">Generate Link</button>

    <div id="resultContainer" style="display:none;">
      <input type="text" id="shortUrlOutput" readonly />
      <button id="copyBtn">Copy</button>
    </div>
  </div>

  <script>
    document.getElementById('shortenBtn').addEventListener('click', ()=>{
      const input = document.getElementById('longUrlInput').value.trim();
      if(!input) return alert("Enter valid URL");

      const validUrl = input.startsWith('http') ? input : 'https://' + input;
      const encoded = encodeURIComponent(validUrl);
      const verifyUrl = `${window.location.origin}/verify.html?target=${encoded}`;
      
      document.getElementById('shortUrlOutput').value = verifyUrl;
      document.getElementById('resultContainer').style.display = 'block';
    });

    document.getElementById('copyBtn').addEventListener('click', ()=>{
      const field = document.getElementById('shortUrlOutput');
      navigator.clipboard.writeText(field.value);
      alert('Copied!');
    });
  </script>
</body>
</html>
