<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dareloom — 3-Step Verification</title>
  
  <style>
    /* आपके द्वारा दिया गया Verification CSS (स्टाइल) */
    :root{--bg:#050714;--card:#0b1120;--accent:#00ff88;--muted:#9ab;}
    body{font-family:Inter,system-ui,Arial;background:linear-gradient(#050714,#07081a);color:#e6f2ff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
    .wrap{width:100%;max-width:920px}
    .card{background:var(--card);padding:20px;border-radius:12px;border:1px solid rgba(0,255,136,0.06);box-shadow:0 12px 40px rgba(0,0,0,0.6)}
    h1{margin:0;color:var(--accent)}
    p.muted{color:#9ab;margin:6px 0 14px}
    .progress{margin-bottom:12px;color:#9ab}
    .steps{display:grid;grid-template-columns:1fr;gap:12px}
    .step{background:#0f1724;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.02)}
    .step h2{margin:0 0 8px;font-size:18px;color:#bfe}
    .ad-slot{background:#111425;padding:10px;border-radius:8px;border:1px dashed rgba(255,255,255,0.03);min-height:100px;display:flex;align-items:center;justify-content:center}
    .controls{display:flex;gap:8px;margin-top:12px; align-items: center;}
    .btn{padding:10px 12px;border-radius:8px;border:0;background:var(--accent);color:#001;font-weight:700;cursor:pointer; transition: background 0.2s, transform 0.2s;}
    .btn:hover:not(.disabled){background:#33ffaa; transform: scale(1.02);}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:#9ab}
    .btn.disabled{opacity:0.45;cursor:not-allowed}
    .timer{font-weight:800;color:var(--accent);margin-left:8px}
    .final-info{margin-top:12px;color:#9ab;font-size:13px}
    .hint{font-size:13px;color:#9ab;text-align:center; flex-grow: 1;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Complete 3-Step Verification</h1>
      <p class="muted">Complete all three steps to unlock your link.</p>
      <div class="progress" id="progressText">Step 1 of 3</div>

      <div class="steps">
        <div class="step" id="step-1">
          <h2>Step 1 — Begin</h2>
          <div class="ad-slot" id="ad-step1">
            <script async="async" data-cfasync="false" src="//pl27812285.effectivegatecpm.com/acada87426efb7bc58c49a74cd786001/invoke.js"></script>
            <div id="container-acada87426efb7bc58c49a74cd786001"></div>
          </div>
          <div class="controls">
            <button class="btn" id="start1">Start Step 1 (10s)</button>
            <div class="hint" id="hint1"></div>
          </div>
        </div>

        <div class="step" id="step-2" style="display:none;">
          <h2>Step 2 — Continue</h2>
          <div class="ad-slot" id="ad-step2">
            <script async="async" data-cfasync="false" src="//pl27812285.effectivegatecpm.com/acada87426efb7bc58c49a74cd786001/invoke.js"></script>
            <div id="container-acada87426efb7bc58c49a74cd786001-2"></div>
          </div>
          <div class="controls">
            <button class="btn" id="start2" disabled>Start Step 2 (10s)</button>
            <div class="hint" id="hint2"></div>
          </div>
        </div>

        <div class="step" id="step-3" style="display:none;">
          <h2>Step 3 — Final</h2>
          <div class="ad-slot" id="ad-step3">
            <script async="async" data-cfasync="false" src="//pl27812285.effectivegatecpm.com/acada87426efb7bc58c49a74cd786001/invoke.js"></script>
            <div id="container-acada87426efb7bc58c49a74cd786001-3"></div>
            <div class="hint" style="margin-top:8px">Propeller Direct (zone): <small style="color:#9ab">https://otieu.com/4/10014093</small></div>
          </div>
          <div class="controls">
            <button class="btn" id="start3" disabled>Start Step 3 (10s)</button>
            <div class="hint" id="hint3"></div>
          </div>
        </div>
      </div>

      <div class="final-info" id="finalInfo">
        After completing Step 3, the <strong>Get Link</strong> button will appear and let you open the destination.
      </div>
    </div>
  </div>

  <script type='text/javascript' src='//pl27654958.effectivegatecpm.com/cb/63/19/cb6319838ced4608354b54fc6faddb8a.js'></script>

<script>
// Main Verification Logic
(function(){
  const params = new URLSearchParams(location.search);
  const target = params.get('target'); 
  const progressText = document.getElementById('progressText');

  const start1 = document.getElementById('start1');
  const start2 = document.getElementById('start2');
  const start3 = document.getElementById('start3');

  const hint1 = document.getElementById('hint1');
  const hint2 = document.getElementById('hint2');
  const hint3 = document.getElementById('hint3');

  const step1 = document.getElementById('step-1');
  const step2 = document.getElementById('step-2');
  const step3 = document.getElementById('step-3');
  
  let finalBtn = null;

  if(!target){
    document.body.innerHTML = '<div style="padding:30px;color:#f66;background:#111;border-radius:8px;margin:40px auto;max-width:700px;text-align:center">Invalid or missing target. Use the generator to create a verification link.</div>';
    return;
  }

  function startTimer(btn, hintEl, seconds, onComplete){
    // Inject Propeller Pop-under on start click (user-initiated)
    window.open('https://otieu.com/4/10014093', '_blank', 'noopener,noreferrer');

    btn.disabled = true;
    btn.classList.add('disabled');
    let t = seconds;
    hintEl.textContent = `${t}s remaining...`;
    
    const id = setInterval(()=>{
      t--;
      hintEl.textContent = `${t}s remaining...`;
      if(t <= 0){
        clearInterval(id);
        hintEl.textContent = `Step complete ✅`;
        btn.textContent = 'Completed';
        // Note: keeping disabled = true so user cannot re-trigger the pop-under/timer
        if(typeof onComplete === 'function') onComplete();
      }
    }, 1000);
  }

  // --- Step 1 Logic ---
  start1.addEventListener('click', ()=>{
    startTimer(start1, hint1, 10, ()=> {
      start2.disabled = false;
      start2.classList.remove('disabled');
      progressText.textContent = 'Step 2 of 3';
      step2.style.display = 'block';
      step2.scrollIntoView({behavior:'smooth',block:'center'});
    });
  }, { once: true }); // Only allow one click

  // --- Step 2 Logic ---
  start2.addEventListener('click', ()=>{
    if(start2.disabled) return;
    startTimer(start2, hint2, 10, ()=> {
      start3.disabled = false;
      start3.classList.remove('disabled');
      progressText.textContent = 'Step 3 of 3';
      step3.style.display = 'block';
      step3.scrollIntoView({behavior:'smooth',block:'center'});
    });
  }, { once: true }); // Only allow one click

  // --- Step 3 Logic ---
  start3.addEventListener('click', ()=>{
    if(start3.disabled) return;
    startTimer(start3, hint3, 10, ()=> {
      progressText.textContent = 'All steps complete';
      
      // Final button creation
      if(!finalBtn){
        finalBtn = document.createElement('button');
        finalBtn.className = 'btn';
        finalBtn.textContent = '✅ Get Link';
        finalBtn.style.marginTop = '20px'; // Added extra margin for better spacing
        finalBtn.addEventListener('click', ()=> {
          // Open target in new tab (user-initiated, best for bypassing pop-up blockers)
          const decoded = decodeURIComponent(target);
          window.open(decoded, '_blank', 'noopener,noreferrer');
        }, { once:true });
        
        document.getElementById('finalInfo').appendChild(finalBtn);
        finalBtn.scrollIntoView({behavior:'smooth', block:'center'});
      }
    });
  }, { once: true }); // Only allow one click

  // Initial state setup
  start2.disabled = true;
  start2.classList.add('disabled');
  start3.disabled = true;
  start3.classList.add('disabled');
})();
</script>
</body>
</html>
